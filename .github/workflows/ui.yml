name: UI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

# Only the newest commit of a branch runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui:
    permissions:
      contents: read
    name: Lint, test and Playwright
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: ui/package.json

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ui/.nvmrc
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check the dependencies for known vulnerabilities
        run: pnpm audit --audit-level high

      - name: Lint, type check and unit tests
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test

      - name: Check that the generated API client is current
        working-directory: .
        run: |
          make ui-proto
          git diff --exit-code ui/src/gen

      - name: Build
        run: pnpm build

      - name: Playwright
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm e2e

      - name: Keep the Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: ui/playwright-report
          retention-days: 7
