name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

# Only the newest commit of a branch runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    permissions:
      contents: read
    name: Run on Ubuntu
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CHRONICLE_TEST_POSTGRES: postgres://postgres:test@127.0.0.1:55432/postgres?sslmode=disable
      CHRONICLE_TEST_S3: 127.0.0.1:58333
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # A service container cannot get the arguments that SeaweedFS needs, so a step starts it.
      - name: Start the S3 store of the artifact tests
        run: make s3-up

      - name: Running Tests
        run: make test

      - name: Generate the protobuf code
        run: make proto

      - name: Check that generated files are up to date
        run: git diff --exit-code
