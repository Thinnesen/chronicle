apiVersion: chronicle.thinnesen.com/v1alpha1
kind: Workflow
metadata:
  name: artifacts
spec:
  entrypoint: main
  # The Pods go away at once, so the logs must come from the log archive.
  podGC:
    strategy: OnPodCompletion
  templates:
  - name: main
    dag:
      tasks:
      - {name: make, template: make}
      - {name: use, template: use, depends: make, arguments: {artifacts: [{name: data, from: "{{tasks.make.outputs.artifacts.data}}"}]}}
  - name: make
    outputs:
      artifacts: [{name: data, path: /tmp/out}]
    script:
      image: busybox:1.37@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
      source: mkdir -p /tmp/out/sub && echo passed-between-steps > /tmp/out/sub/file.txt
  - name: use
    inputs:
      artifacts: [{name: data, path: /tmp/in}]
    script:
      image: busybox:1.37@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
      source: cat /tmp/in/sub/file.txt
