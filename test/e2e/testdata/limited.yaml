apiVersion: chronicle.thinnesen.com/v1alpha1
kind: Workflow
metadata:
  name: limited
spec:
  entrypoint: main
  parallelism: 2
  synchronization:
    mutex: {name: e2e}
  templates:
  - name: main
    dag:
      tasks:
      - name: item
        template: work
        withItems: [a, b, c, d]
        arguments:
          parameters:
          - {name: what, value: "{{item}}"}
  - name: work
    inputs:
      parameters:
      - name: what
    container:
      image: busybox:1.37@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
      command: [sh, -c, 'echo "$WHAT"']
      env:
      - {name: WHAT, value: "{{inputs.parameters.what}}"}
