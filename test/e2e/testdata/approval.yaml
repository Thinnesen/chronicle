apiVersion: chronicle.thinnesen.com/v1alpha1
kind: Workflow
metadata:
  name: approval
spec:
  entrypoint: main
  templates:
  - name: main
    steps:
    - - name: gate
        template: gate
    - - name: deploy
        template: deploy
        arguments:
          parameters:
          - name: env
            value: "{{steps.gate.outputs.parameters.env}}"
  - name: gate
    outputs:
      parameters:
      - name: env
        default: staging
    suspend: {}
  - name: deploy
    inputs:
      parameters:
      - name: env
        enum: [prod]
    container:
      image: busybox:1.37@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
      command: [echo, "{{inputs.parameters.env}}"]
