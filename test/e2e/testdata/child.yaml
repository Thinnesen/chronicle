# A parent run starts a child run of a template and checks its output.
apiVersion: chronicle.thinnesen.com/v1alpha1
kind: WorkflowTemplate
metadata:
  name: child-count
spec:
  entrypoint: count
  arguments:
    parameters:
    - name: day
  templates:
  - name: count
    inputs:
      parameters:
      - name: day
        value: "{{workflow.parameters.day}}"
    outputs:
      parameters:
      - name: rows
        globalName: rows
        valueFrom: {path: /tmp/rows}
    script:
      image: busybox:1.37@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
      env:
      - name: DAY
        value: "{{inputs.parameters.day}}"
      source: |
        test "$DAY" = 2026-10-20 && echo -n 42 > /tmp/rows
---
apiVersion: chronicle.thinnesen.com/v1alpha1
kind: Workflow
metadata:
  name: child-parent
spec:
  entrypoint: main
  templates:
  - name: main
    dag:
      tasks:
      - name: load
        template: load
      - name: check
        template: check
        depends: load
        arguments:
          parameters:
          - name: got
            value: "{{tasks.load.outputs.parameters.rows}}"
  - name: load
    outputs:
      parameters:
      - name: rows
    childWorkflow:
      workflowTemplateRef: {name: child-count}
      arguments:
        parameters:
        - name: day
          value: "2026-10-20"
  - name: check
    inputs:
      parameters:
      - name: got
    script:
      image: busybox:1.37@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
      env:
      - name: GOT
        value: "{{inputs.parameters.got}}"
      source: |
        test "$GOT" = 42
