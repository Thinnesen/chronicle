apiVersion: chronicle.thinnesen.com/v1alpha1
kind: Workflow
metadata:
  name: dag-succeeds
spec:
  entrypoint: main
  arguments:
    parameters:
    - name: who
      value: world
  templates:
  - name: main
    dag:
      tasks:
      - name: hello
        template: say
        arguments:
          parameters:
          - name: text
            value: "hello {{workflow.parameters.who}}"
      - name: fan
        template: say
        depends: hello
        withItems: [a, b]
        arguments:
          parameters:
          - name: text
            value: "{{tasks.hello.outputs.result}} {{item}}"
      - name: check
        template: check
        depends: fan
        arguments:
          parameters:
          - name: got
            value: "{{tasks.fan.outputs.result}}"
  - name: say
    inputs:
      parameters:
      - name: text
    container:
      image: busybox:1.37@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
      command: [echo, "{{inputs.parameters.text}}"]
  - name: check
    inputs:
      parameters:
      - name: got
    script:
      image: busybox:1.37@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
      env:
      - name: GOT
        value: "{{inputs.parameters.got}}"
      source: |
        test "$GOT" = '["hello world a","hello world b"]'
