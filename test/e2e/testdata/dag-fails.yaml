apiVersion: chronicle.thinnesen.com/v1alpha1
kind: Workflow
metadata:
  name: dag-fails
spec:
  entrypoint: main
  templates:
  - name: main
    dag:
      tasks:
      - name: boom
        template: boom
      - name: after
        template: boom
        depends: boom
  - name: boom
    container:
      image: busybox:1.37@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
      command: [sh, -c, "exit 3"]
