apiVersion: chronicle.thinnesen.com/v1alpha1
kind: Workflow
metadata:
  name: timeout-log
spec:
  entrypoint: main
  templates:
  - name: main
    timeout: 15s
    script:
      image: busybox:1.37@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
      # The shell waits for sleep, so it ignores SIGTERM. The executor must still save the log.
      source: echo important-line; sleep 300
