---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-chronicle-thinnesen-com-v1alpha1-clusterworkflowtemplate
  failurePolicy: Fail
  name: vclusterworkflowtemplate-v1alpha1.kb.io
  rules:
  - apiGroups:
    - chronicle.thinnesen.com
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - clusterworkflowtemplates
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-chronicle-thinnesen-com-v1alpha1-workflow
  failurePolicy: Fail
  name: vworkflow-v1alpha1.kb.io
  rules:
  - apiGroups:
    - chronicle.thinnesen.com
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - workflows
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-chronicle-thinnesen-com-v1alpha1-workflowtemplate
  failurePolicy: Fail
  name: vworkflowtemplate-v1alpha1.kb.io
  rules:
  - apiGroups:
    - chronicle.thinnesen.com
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - workflowtemplates
  sideEffects: None
