---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - create
  - delete
  - get
  - list
  - watch
- apiGroups:
  - chronicle.thinnesen.com
  resources:
  - cronworkflows
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - chronicle.thinnesen.com
  resources:
  - cronworkflows/status
  - workflows/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - chronicle.thinnesen.com
  resources:
  - workflows
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - chronicle.thinnesen.com
  resources:
  - workflows/finalizers
  verbs:
  - update
