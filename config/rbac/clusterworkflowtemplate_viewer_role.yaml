# This rule is not used by the project chronicle itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to chronicle.thinnesen.com resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: chronicle
    app.kubernetes.io/managed-by: kustomize
  name: clusterworkflowtemplate-viewer-role
rules:
- apiGroups:
  - chronicle.thinnesen.com
  resources:
  - clusterworkflowtemplates
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - chronicle.thinnesen.com
  resources:
  - clusterworkflowtemplates/status
  verbs:
  - get
