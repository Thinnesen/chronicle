apiVersion: v1
kind: ServiceAccount
metadata:
  name: server
  namespace: system
  labels:
    app.kubernetes.io/name: chronicle
    app.kubernetes.io/component: server
---
apiVersion: v1
kind: Service
metadata:
  name: server
  namespace: system
  labels:
    app.kubernetes.io/name: chronicle
    app.kubernetes.io/component: server
spec:
  selector:
    app.kubernetes.io/name: chronicle
    app.kubernetes.io/component: server
  ports:
  - name: http
    port: 8080
    targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: server
  namespace: system
  labels:
    app.kubernetes.io/name: chronicle
    app.kubernetes.io/component: server
spec:
  # The default session store is in memory. Use one replica with it.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: chronicle
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chronicle
        app.kubernetes.io/component: server
    spec:
      serviceAccountName: server
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: server
        image: controller:latest
        command: [/chronicle-server]
        args:
        - --auth-config=/etc/chronicle/auth/config.yaml
        ports:
        - name: http
          containerPort: 8080
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 256Mi
        volumeMounts:
        - name: auth
          mountPath: /etc/chronicle/auth
          readOnly: true
      volumes:
      # The login configuration. Without it, the server does not start.
      - name: auth
        configMap:
          name: server-auth
          optional: true
