# The server acts for users only through impersonation. Its own permissions are to list namespace names,
# which it filters with access reviews as the user, to write audit Events, and to read the artifact repository
# of a namespace after an access review as the user.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: server-impersonator
rules:
- apiGroups: [""]
  resources: [users, groups, serviceaccounts]
  verbs: [impersonate]
# TokenReviews check the service account tokens of the CLI and the SDKs.
- apiGroups: [authentication.k8s.io]
  resources: [tokenreviews]
  verbs: [create]
- apiGroups: [""]
  resources: [namespaces]
  verbs: [list]
- apiGroups: [""]
  resources: [events]
  verbs: [create]
- apiGroups: [""]
  resources: [configmaps, secrets]
  resourceNames: [chronicle-artifact-repository]
  verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: server-impersonator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: server-impersonator
subjects:
- kind: ServiceAccount
  name: server
  namespace: system
