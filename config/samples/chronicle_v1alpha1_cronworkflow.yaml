apiVersion: chronicle.thinnesen.com/v1alpha1
kind: CronWorkflow
metadata:
  labels:
    app.kubernetes.io/name: chronicle
    app.kubernetes.io/managed-by: kustomize
  name: cronworkflow-sample
spec:
  schedules: ["0 3 * * *"]
  timezone: Europe/Berlin
  concurrencyPolicy: Forbid
  workflowSpec:
    entrypoint: main
    templates:
    - name: main
      container:
        image: busybox:1.37@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
        command: [echo, "nightly run of {{workflow.name}}"]
