            description: spec defines the desired state of CronWorkflow
            properties:
              concurrencyPolicy:
                description: concurrencyPolicy tells what to do when an earlier run
                  is still active. The default is Allow.
                enum:
                - Allow
                - Forbid
                - Replace
                type: string
              failedJobsHistoryLimit:
                description: failedJobsHistoryLimit is the number of failed runs to
                  keep. The default is 1.
                format: int32
                minimum: 0
                type: integer
              schedules:
                description: schedules are cron expressions with five fields, for
                  example "0 3 * * *". A run starts at each time of each schedule.
                items:
                  maxLength: 256
                  type: string
                maxItems: 20
                minItems: 1
                type: array
              startingDeadlineSeconds:
                description: startingDeadlineSeconds skips a run that could not start
                  in this time after its schedule.
                format: int64
                minimum: 0
                type: integer
              successfulJobsHistoryLimit:
                description: successfulJobsHistoryLimit is the number of succeeded
                  runs to keep. The default is 3.
                format: int32
                minimum: 0
                type: integer
              suspend:
                description: suspend stops new runs. Active runs go on.
                type: boolean
              timezone:
                description: timezone of the schedules, for example "Europe/Berlin".
                  The default is UTC.
                maxLength: 64
                type: string
              workflowMetadata:
                description: workflowMetadata are labels and annotations for the created
                  Workflows.
