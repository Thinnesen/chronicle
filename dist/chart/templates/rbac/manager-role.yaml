apiVersion: rbac.authorization.k8s.io/v1
{{- if .Values.rbac.namespaced }}
kind: Role
{{- else }}
kind: ClusterRole
{{- end }}
metadata:
{{- if .Values.rbac.namespaced }}
  namespace: {{ .Release.Namespace }}
{{- end }}
  name: {{ include "chronicle.resourceName" (dict "suffix" "manager-role" "context" $) }}
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - get
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - create
  - delete
  - get
  - list
  - watch
- apiGroups:
  - chronicle.thinnesen.com
  resources:
  - clusterworkflowtemplates
  - cronworkflows
  - workflowtemplates
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - chronicle.thinnesen.com
  resources:
  - cronworkflows/status
  - workflows/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - chronicle.thinnesen.com
  resources:
  - workflows
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - chronicle.thinnesen.com
  resources:
  - workflows/finalizers
  verbs:
  - update
