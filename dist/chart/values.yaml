## String to partially override chart.fullname template (will maintain the release name)
##
# nameOverride: ""

## String to fully override chart.fullname template
##
# fullnameOverride: ""

## Configure the controller manager deployment
##
manager:
  ## Set to false to skip manager installation
  ##
  enabled: true

  replicas: 1

  ## The chronicle image. The controller, the server and the workflow executor use it.
  ## Pin it by digest in production: repository: ghcr.io/thinnesen/chronicle@sha256:...
  ##
  image:
    repository: ghcr.io/thinnesen/chronicle
    ## Image tag (defaults to Chart.appVersion if not set)
    ##
    # tag: ""
    pullPolicy: IfNotPresent

  ## Workflow Pods run the executor from an image volume of the chronicle image, so most Pods need no init container.
  ## Set false for container runtimes without image volumes (containerd before 2.1, CRI-O before 1.31).
  ##
  executorImageVolume: true

  ## Arguments
  ##
  args:
    - --leader-elect

  ## Health probes.
  ## The manager serves the liveness (/healthz) and readiness (/readyz) endpoints on this port.
  ##
  healthProbe:
    # Health probe server port
    port: 8081

  ## Environment variables
  ##
  ## The executor image comes from manager.image (see the template). Add other variables here.
  env: []

  ## Env overrides (--set manager.envOverrides.VAR=value)
  ## Same name in env above: this value takes precedence.
  ##
  envOverrides: {}

  ## Image pull secrets
  ##
  # imagePullSecrets:
  #   - name: myregistrykey

  ## Pod-level security settings
  ##
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

  ## Container-level security settings
  ##
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
      - ALL
    readOnlyRootFilesystem: true

  ## Resource limits and requests
  ##
  resources:
    limits:
      cpu: 500m
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 64Mi

  ## Manager pod's affinity
  ##
  affinity: {}

  ## Manager pod's node selector
  ##
  nodeSelector: {}

  ## Manager pod's tolerations
  ##
  tolerations: []

  ## Deployment strategy
  ##
  # strategy:
  #   type: RollingUpdate
  #   rollingUpdate:
  #     maxSurge: 25%
  #     maxUnavailable: 25%

  ## Priority class name
  ##
  # priorityClassName: ""

  ## Topology spread constraints
  ##
  # topologySpreadConstraints: []

  ## Termination grace period seconds
  ##
  terminationGracePeriodSeconds: 10

  ## Custom Deployment labels
  ##
  # labels: {}

  ## Custom Deployment annotations
  ##
  # annotations: {}

  ## Custom Pod labels and annotations
  ##
  # pod:
  #   labels: {}
  #   annotations: {}

## RBAC configuration
##
rbac:
  ## RBAC resource scope
  ## - false (default): ClusterRole/ClusterRoleBinding (all namespaces)
  ## - true: Role/RoleBinding (release namespace only)
  ##
  namespaced: false

  ## Helper roles for CRD management (admin/editor/viewer)
  ##
  helpers:
    ## Install convenience admin/editor/viewer roles for CRDs
    ##
    enabled: false

## ServiceAccount configuration
##
serviceAccount:
  # Install default ServiceAccount provided
  enabled: true

  ## Existing ServiceAccount name (required when enabled=false)
  ## Set to "default" to use the namespace default ServiceAccount
  ## Note: When enabled=true, respects nameOverride/fullnameOverride
  ##
  # name: ""

  ## Custom ServiceAccount annotations
  ##
  # annotations: {}

  ## Custom ServiceAccount labels
  ##
  # labels: {}

## Custom Resource Definitions
##
crd:
  # Install CRDs with the chart
  enabled: true
  # Keep CRDs when uninstalling
  keep: true

## Controller metrics endpoint.
## Enable to expose /metrics endpoint
##
metrics:
  enabled: true
  # Metrics server port
  port: 8443
  # Enable secure metrics: HTTPS with certs/auth (true) or HTTP (false).
  # Note: Metrics authn/authz needs ClusterRole access.
  secure: true

## Cert-manager integration for TLS certificates.
## Required for webhook certificates and metrics endpoint certificates.
##
certManager:
  enabled: true

## Webhook server configuration
##
webhook:
  enabled: true
  # Webhook server port
  port: 9443

## Prometheus ServiceMonitor for metrics scraping.
## Requires prometheus-operator to be installed in the cluster.
##
prometheus:
  enabled: false

  ## Custom ServiceMonitor labels
  ##
  # labels: {}

  ## Custom ServiceMonitor annotations
  ##
  # annotations: {}

## Network policies for controlling traffic flow.
## Enable to restrict ingress to the controller manager.
##
networkPolicy:
  enabled: false


## The API server and the web UI.
##
server:
  enabled: true
  ## The login sessions are in the archive database, so more than one replica needs archive.existingSecret.
  replicas: 1
  ## The path of chronicle on its host, for example /chronicle when an ingress serves it at https://example.com/chronicle.
  ## Then auth.redirectURL also has the path: https://example.com/chronicle/auth/callback. Empty serves it at the root.
  basePath: ""
  ## Environment variables of the server, for example OTEL_EXPORTER_OTLP_ENDPOINT for traces.
  env: []
  service:
    ## ClusterIP behind an ingress, or LoadBalancer.
    type: ClusterIP
    port: 80
    # loadBalancerIP: ""
    annotations: {}
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 256Mi
  nodeSelector: {}

## Login. Set auth.entra (Microsoft Entra ID, see docs/entra-id.md) or auth.oidc (any OIDC provider).
## Without both, the UI has no login and the API accepts only service account tokens (CLI and SDKs).
##
auth:
  ## The callback URL of the UI, for example https://chronicle.example.com/auth/callback.
  redirectURL: ""
  entra:
    tenantID: ""
    clientID: ""
    clientSecret:
      existingSecret: ""
      key: client-secret
    ## groups (security group IDs) or roles (app roles)
    groupsFrom: ""
    ## The application (client) ID of a public client for the CLI login (device flow), see docs/entra-id.md. Empty
    ## turns the CLI login off; then the CLI needs a service account token.
    cliClientID: ""
  oidc:
    issuer: ""
    clientID: ""
    clientSecret:
      existingSecret: ""
      key: client-secret
    scopes: []
    usernameClaim: ""
    groupsClaim: ""
    usernamePrefix: ""
    groupsPrefix: ""
    ## The client ID of a public client with the device flow, for the CLI login. Empty turns the CLI login off; then
    ## the CLI needs a service account token.
    cliClientID: ""
  session:
    ttl: 8h
    idleTimeout: 1h
  ## Cookies without the Secure flag, for a test setup over plain HTTP only.
  insecureCookies: false

## Teams: each group gets chronicle-viewer, chronicle-editor or chronicle-admin in the namespaces of its team.
## The namespaces must exist. The group prefix comes from auth (entra:group:, entra:role: or oidc:).
##
teams: []
#  - name: data
#    namespaces: [data-dev, data-prod]
#    viewer: [3b7e0000-0000-0000-0000-000000000001]
#    editor: [3b7e0000-0000-0000-0000-000000000002]
#    admin: []

## The roles chronicle-viewer, chronicle-editor and chronicle-admin.
##
userRoles:
  enabled: true

## The PostgreSQL archive of finished runs. A Secret with the DSN in the key.
##
archive:
  existingSecret: ""
  key: dsn
  # retention deletes archived runs, finished tasks and step cache entries older than this, for example 2160h
  # (90 days). Empty keeps them.
  retention: ""
